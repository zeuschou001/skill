app:
  description: Chatflow for parsing uploaded IoT protocol specifications and generating Java or Python parser code.
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: IoT Protocol Parser
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .txt
      - .markdown
      - .md
      - .mdx
      - .pdf
      - .html
      - .htm
      - .xlsx
      - .xls
      - .docx
      - .csv
      - .vtt
      - .properties
      - .TXT
      - .MARKDOWN
      - .MD
      - .MDX
      - .PDF
      - .HTML
      - .HTM
      - .XLSX
      - .XLS
      - .DOCX
      - .CSV
      - .VTT
      - .PROPERTIES
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
